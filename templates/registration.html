<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
            background-color: #f5f5f5;
        }

        /* Header */
        .mainHeading {
            text-align: center;
            background-color: #110f92;
            color: white;
            padding: 15px;
        }

        /* Form Container */
        .wrap {
            width: 450px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border: 5px solid rgb(204, 122, 16);
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .wrap h2 {
            color: darkblue;
            font-size: 24px;
            margin-bottom: 15px;
        }

        /* Input Fields */
        .wrap input[type="text"],
        .wrap select,
        .wrap input[type="file"] {
            width: 90%;
            height: 35px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid rgb(25, 9, 119);
            padding: 5px;
            text-align: center;
            font-size: 16px;
        }

        .wrap select {
            cursor: pointer;
        }

        .wrap input[type="file"] {
            padding: 8px;
        }

        /* Submit Button */
        .wrap .btn-submit {
            padding: 10px;
            width: 100%;
            background-color: #55add6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .wrap .btn-submit:hover {
            background-color: #3b92c4;
        }

        /* Instructions */
        .instructions {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }

        /* Login Link */
        .login-link {
            margin-top: 10px;
            font-size: 16px;
        }

        .login-link a {
            color: #110f92;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Page Header -->
    <div class="mainHeading">
        <h1>Student Registration</h1>
    </div>

    <!-- Registration Form -->
    <div class="wrap">
        {% if msg %}
            <p style="color: red; font-weight: bold;">{{ msg }}</p>
        {% endif %}

        <h2>Enter Your Details</h2>

        <form action="/studentReg" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="roll_id" value="{{ session.get('user') }}" placeholder="Roll Number" readonly aria-label="Signed-in student roll number">
            <input type="text" name="batch" placeholder="Batch (Ex. 2024)" required>

            <select name="branch" id="branch" required>
                <option value="" disabled selected>-- Select Branch --</option>
                <option value="ce">CE</option>
                <option value="it">IT</option>
                <option value="me">ME</option>
                <option value="ec">EC</option>
                <option value="ee">EE</option>
            </select>

            <p class="instructions">
                <b>Note:</b> Upload a ZIP file containing **25 front-facing photos** of yourself.
            </p>
            <input type="file" name="file" accept=".zip" required>

            <button type="submit" class="btn-submit">Submit</button>

            <div class="login-link">
                or <a href="/">Login</a>
            </div>
        </form>
    </div>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        let branchSelect = document.getElementById("branch");

        // ✅ Ensure user selects a valid branch
        document.querySelector("form").addEventListener("submit", function (event) {
            if (!branchSelect.value) {
                alert("⚠️ Please select a branch before submitting!");
                event.preventDefault();
            }
        });
    });
</script>
</body>
</html>
