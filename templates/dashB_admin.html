<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Admin Dashboard | Train Model</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
            background-color: #f5f5f5;
        }

        .mainHeading {
            text-align: center;
            background-color: #110f92;
            color: white;
            padding: 20px;
        }

        .navbar {
            background-color: #000;
            padding: 10px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin: 0 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .wrap {
            width: 450px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border: 5px solid rgb(204, 122, 16);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .wrap h2 {
            color: darkblue;
        }

        .wrap input[type="text"], .wrap select {
            width: 90%;
            height: 35px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid rgb(25, 9, 119);
            padding: 5px;
            text-align: center;
        }

        .wrap .btn-submit {
            padding: 10px;
            width: 100%;
            background-color: #55add6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .wrap .btn-submit:hover {
            background-color: #3b92c4;
        }

        .message {
            font-size: 18px;
            color: green;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .error {
            color: red;
        }

    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <a href="/admin">Admin Dashboard</a>
        <a href="/admin/addRecord">Add Record</a>
        <a href="/admin/delete">Remove Record</a>
        <a href="/admin">Dashboard</a>
        <form action="{{ url_for('logout') }}" method="POST" style="display:inline"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><button type="submit" style="background:none;border:0;color:white;font-size:18px;cursor:pointer">Logout</button></form>  <!-- ✅ Logout Button Added -->
        
        <!-- <a href="/">Logout</a> -->
    </div>

    <!-- Page Heading -->
    <div class="mainHeading">
        <h1>Admin Dashboard</h1>
    </div>

    <!-- Form Wrapper -->
    <div class="wrap">
        {% if msg %}
            <div class="message {% if 'error' in msg.lower() %}error{% endif %}">{{ msg }}</div>
        {% endif %}

        <h2>Train Model</h2>
        
        <form action="/admin/" method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="batch" placeholder="Batch (Ex. 2024)" pattern="\d{4}" title="Enter a valid batch year (e.g., 2024)" required>

            <label for="branch"><b>Select Branch</b></label>
            <select name="branch" id="branch" required>
                <option value="ce">CE</option>
                <option value="it">IT</option>
                <option value="me">ME</option>
                <option value="ec">EC</option>
                <option value="ee">EE</option>   
            </select>

            <button type="submit" class="btn-submit">Train Model</button>
        </form>
    </div>

</body>
</html>
