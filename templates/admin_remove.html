<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Admin Dashboard | Remove Record</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
            background-color: #f5f5f5;
        }

        .mainHeading {
            text-align: center;
            background-color: #110f92;
            color: white;
            padding: 20px;
        }

        .navbar {
            background-color: #000;
            padding: 10px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin: 0 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .wrap {
            width: 450px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border: 5px solid rgb(204, 122, 16);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .wrap h2 {
            color: darkblue;
        }

        .wrap input[type="text"], .wrap .select {
            width: 90%;
            height: 35px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid rgb(25, 9, 119);
            padding: 5px;
            text-align: center;
        }

        .wrap .btn-submit {
            padding: 10px;
            width: 100%;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .wrap .btn-submit:hover {
            background-color: #c9302c;
        }

        .radio-container {
            margin: 10px 0;
        }

        .radio-container label {
            font-size: 18px;
            margin: 0 10px;
            cursor: pointer;
        }

        .message {
            font-size: 18px;
            color: green;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .error {
            color: red;
        }

    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <a href="/admin">Admin Dashboard</a>
        <a href="/admin/addRecord">Add Login</a>
        <a href="/admin/delete">Remove Login</a>
    </div>

    <!-- Page Heading -->
    <div class="mainHeading">
        <h1>Remove Record</h1>
    </div>

    <!-- Form Wrapper -->
    <div class="wrap">
        {% if msg %}
            <div class="message {% if 'error' in msg.lower() %}error{% endif %}">{{ msg }}</div>
        {% endif %}

        <h2>Enter Details</h2>
        
        <form action="/admin/delete" method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="radio-container">
                <input type="radio" name="remove_id" value="Student" id="student" required>
                <label for="student">Student</label>
                <input type="radio" name="remove_id" value="Faculty" id="faculty" required>
                <label for="faculty">Faculty</label>
            </div>

            <input type="text" name="id" placeholder="Enter ID to Remove" required>

            <button type="submit" class="btn-submit">Remove</button>
        </form>
    </div>

</body>
</html>
