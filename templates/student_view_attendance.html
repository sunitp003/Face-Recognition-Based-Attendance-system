<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Attendance</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .mainHeading {
            text-align: center;
            background-color: #110f92;
            color: white;
            padding: 20px;
        }
        .navbar {
            background-color: #000;
            padding: 10px;
            text-align: center;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin: 0 15px;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .wrap {
            width: 30%;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border: 5px solid rgb(204, 122, 16);
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .wrap h2 {
            color: darkblue;
            font-size: 24px;
        }
        .wrap select,
        .wrap input[type="date"] {
            width: 90%;
            height: 35px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid rgb(25, 9, 119);
            padding: 5px;
            text-align: center;
        }
        .wrap .btn-submit {
            padding: 10px;
            width: 100%;
            background-color: #55add6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        .wrap .btn-submit:hover {
            background-color: #3b92c4;
        }
        .table-container {
            width: 95%;
            margin: 30px auto;
            overflow-x: auto;
            display: {% if result %}block{% else %}none{% endif %};
        }
        .view {
            width: 100%;
            border-collapse: collapse;
        }
        .view th, .view td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        .view th {
            background-color: #110f92;
            color: white;
        }
        .present { background-color: #c8e6c9; font-weight: bold; }
        .absent { background-color: #ffcccb; font-weight: bold; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">Home</a>
        <a href="{{ url_for('logout') }}">Logout</a>
        <a href="/studentDashboard">Dashboard</a>
    </div>
    <div class="mainHeading">
        <h1>View Attendance</h1>
    </div>
    <div class="wrap">
        {% if msg %}
            <div class="message {% if 'error' in msg.lower() %}error{% else %}success{% endif %}">
                {{ msg }}
            </div>
        {% endif %}
        <h2>Select Filters</h2>

        <form action="/student/view_attendance" method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">


            <label><b></b></label>
            <label for="subject"><b>Subject:</b></label>
            <select name="subject" id="subject" required>
                <option value="">-- Select Subject --</option>
                {% for subject in subjects %}
                <option value="{{ subject }}">{{ subject }}</option>
                {% endfor %}
            </select>

            <label><b>From Date:</b></label>
            <input type="date" name="from" required>
            <label><b>To Date:</b></label>
            <input type="date" name="to" required>
            <button type="submit" class="btn-submit">View Attendance</button>
        </form>
    </div>
    
    <!-- ✅ Table is now conditionally displayed using Jinja2 -->
    <div class="table-container" id="attendanceTable" style="display: {% if request.method == 'POST' and result %}block{% else %}none{% endif %};">
        <h2>Attendance Record</h2>
        <table class="view">
            <tr>
                <th>Name</th>
                <th>Student ID</th>
                <th>Batch</th>
                <th>Branch</th>
                <th>Year</th>
                <th>Subject</th>
                {% for date in dates %}
                    <th>{{ date }}</th>
                {% endfor %}
                <th>Attendance %</th>
            </tr>
            {% for row in result %}
            <tr>
                {% for item in row %}
                    <td>{{ item }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </table>
    </div>
    
    




    
    


</body>
</html>
