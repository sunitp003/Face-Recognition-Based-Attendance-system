<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Faculty Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
            background-color: #f5f5f5;
        }

        .mainHeading {
            text-align: center;
            background-color: #110f92;
            color: white;
            padding: 20px;
        }

        .navbar {
            background-color: #000;
            padding: 10px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin: 0 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .wrap {
            width: 450px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border: 5px solid rgb(204, 122, 16);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .wrap h2 {
            color: darkblue;
        }

        .wrap input[type="text"], 
        .wrap select {
            width: 90%;
            height: 35px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid rgb(25, 9, 119);
            padding: 5px;
            text-align: center;
        }

        .wrap .btn-submit {
            padding: 10px;
            width: 100%;
            background-color: #55add6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .wrap .btn-submit:hover {
            background-color: #3b92c4;
        }

        .message {
            font-size: 18px;
            color: green;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .error {
            color: red;
        }

    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <a href="/">Login</a>
    </div>

    <!-- Page Heading -->
    <div class="mainHeading">
        <h1>Faculty Registration</h1>
    </div>

    <!-- Form Wrapper -->
    <div class="wrap">
        {% if msg %}
            <div class="message {% if 'error' in msg.lower() %}error{% endif %}">{{ msg }}</div>
        {% endif %}

        <h2>Enter Faculty Details</h2>
        
        <form action="/fReg" method="POST">
            <input type="text" name="fID" placeholder="Enter Your Faculty ID" required>

            <label><b>Select Department</b></label>
            <select name="Deptt" required>
                <option value="" disabled selected>-- Select Department --</option>
                <option value="CSE">CSE</option>
                <option value="IT">IT</option>
                <option value="ME">ME</option>
                <option value="EC">EC</option>
                <option value="EE">EE</option>
                <option value="Basic Science">Basic Science</option>
            </select>

            <button type="submit" class="btn-submit">Register</button>
        </form>
    </div>

</body>
</html>
