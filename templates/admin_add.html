<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Admin Dashboard | Add Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
            background-color: #f5f5f5;
        }

        .mainHeading {
            text-align: center;
            background-color: #110f92;
            color: white;
            padding: 20px;
        }

        .navbar {
            background-color: #000;
            padding: 10px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin: 0 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .wrap {
            width: 450px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border: 5px solid rgb(204, 122, 16);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .wrap h2 {
            color: darkblue;
        }

        .wrap input[type="text"], 
        .wrap input[type="password"], 
        .wrap select {
            width: 90%;
            height: 35px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid rgb(25, 9, 119);
            padding: 5px;
            text-align: center;
        }

        .wrap .btn-submit {
            padding: 10px;
            width: 100%;
            background-color: #55add6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .wrap .btn-submit:hover {
            background-color: #3b92c4;
        }

        .radio-container {
            margin: 10px 0;
        }

        .radio-container label {
            font-size: 18px;
            margin: 0 10px;
            cursor: pointer;
        }

        .message {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        /* Style for Department Label */
        label[for="department"] {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        /* Style for Department Input */
        #departmentField {
            width: 90%;
            height: 40px;
            border-radius: 10px;
            border: 2px solid #1974D2;
            padding: 5px 10px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: 0.3s;
            background-color: #f9f9f9;
        }

        /* Focus Effect */
        #departmentField:focus {
            border-color: #110f92;
            box-shadow: 0px 0px 8px rgba(17, 15, 146, 0.5);
            background-color: white;
        }

        /* Disabled State */
        #departmentField:disabled {
            background-color: #ddd;
            cursor: not-allowed;
            border: 2px solid #aaa;
            opacity: 0.7;
        }

        /* Responsive Design */
        @media (max-width: 500px) {
            .wrap {
                width: 90%;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <a href="/admin">Admin Dashboard</a>
        <a href="/admin/addRecord">Add Login</a>
        <a href="/admin/delete">Remove Login</a>
    </div>

    <!-- Page Heading -->
    <div class="mainHeading">
        <h1>Add Login Details</h1>
    </div>

    <!-- Form Wrapper -->
    <div class="wrap">
        {% if msg %}
            <div class="message {% if 'error' in msg.lower() %}error{% else %}success{% endif %}">
                {{ msg }}
            </div>
        {% endif %}

        <h2>Enter Details</h2>
        
        <form action="/admin/addRecord" method="POST">
            <div class="radio-container">
                <input type="radio" name="add_id" value="Student" id="student" required onclick="enableDepartment()">
                <label for="student">Student</label>
                <input type="radio" name="add_id" value="Faculty" id="faculty" required onclick="enableDepartment()">
                <label for="faculty">Faculty</label>
            </div>
        
            <input type="text" name="username" placeholder="Enter Username" required>
            <input type="password" name="password" placeholder="Enter Password" required>

            <!-- Department field -->
            <!-- <label for="department"><b>Select or Enter Department</b></label>
            <input list="departments" name="department" id="departmentField" placeholder="Enter Department" required disabled>
            <datalist id="departments">
                <option value="CE">
                <option value="IT">
                <option value="ME">
                <option value="EC">
                <option value="EE">
            </datalist> -->

            <button type="submit" class="btn-submit">Add</button>
        </form>
    </div>

    <script>
        function enableDepartment() {
            let departmentField = document.getElementById("departmentField");
            departmentField.disabled = false;
            departmentField.style.backgroundColor = "#fff"; // Make it editable
        }
    </script>

</body>
</html>
