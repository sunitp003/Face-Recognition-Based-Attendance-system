<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>About | Group Face Attendance System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
        }

        .mainHeading {
            background-color: #2622f3;
            color: white;
            text-align: left;
            font-size: 50px;
            padding: 20px;
        }

        .about {
            font-size: 20px;
            padding: 20px;
            line-height: 1.6;
        }

        .table-container {
            padding: 20px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .table th, .table td {
            border: 1px solid midnightblue;
            padding: 10px;
            text-align: left;
            font-size: 18px;
        }

        .table th {
            background-color: #2622f3;
            color: white;
        }

        .navbar {
            background-color: #000;
            padding: 10px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin: 0 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <!-- <a href="/admin">Admin Panel</a>
        <a href="/studentDashboard">Student Dashboard</a>
        <a href="/faculty">Faculty Dashboard</a> -->
    </div>

    <!-- About Section -->
    <div class="mainHeading">
        <b>About</b>
    </div>

    <div class="about">
        <p><b>Project Name:</b> Group Face Attendance System</p>
        <p><b>Project Guide:</b> Dr. Akash D Waghmare</p>
    </div>

    <!-- Developer Table -->
    <div class="table-container">
        <h2>Developed By</h2>
        <table class="table">
            <tr>
                <th>Name</th>
                <th>Branch</th>
                <th>Roll No.</th>
                <th>Email ID</th>
            </tr>

            <!-- Dynamic Content using Flask Jinja -->
            {% for member in team_members %}
            <tr>
                <td>{{ member.name }}</td>
                <td>{{ member.branch }}</td>
                <td>{{ member.roll_no }}</td>
                <td>{{ member.email }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

</body>
</html>
