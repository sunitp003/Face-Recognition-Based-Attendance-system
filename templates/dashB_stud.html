<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Student Dashboard | View Attendance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"> 
    
    <!-- AnyChart Library -->
    <script src="https://cdn.anychart.com/releases/8.0.1/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.0.1/js/anychart-pie.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .mainHeading {
            text-align: center;
            background-color: #110f92;
            color: white;
            padding: 15px;
            font-size: 1.5em;
        }

        .navbar {
            background-color: #000;
            padding: 10px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 1em;
            margin: 0 10px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .wrap {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            text-align: center;
        }

        .form {
            background: white;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            margin: auto;
            border: 2px solid #110f92;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .form input, .form select {
            width: 100%;
            height: 40px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid rgb(25, 9, 119);
            padding: 5px;
            text-align: center;
        }

        .form .btn-submit {
            padding: 10px;
            width: 100%;
            background-color: #55add6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
        }

        .form .btn-submit:hover {
            background-color: #3b92c4;
        }

        .message {
            font-size: 1em;
            color: green;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .error {
            color: red;
        }

        @media (max-width: 600px) {
            .mainHeading {
                font-size: 1.2em;
                padding: 10px;
            }
            .form {
                padding: 15px;
            }
            .navbar a {
                font-size: 0.9em;
                margin: 0 5px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">Home</a>
        <a href="{{ url_for('logout') }}">Logout</a>
        <a href="/faculty">Dashboard</a>
       
    
    </div>

    <div class="mainHeading">
        <h1>Student Dashboard</h1>
    </div>

    <div class="form">
        {% if msg %}
            <div class="message {% if 'error' in msg.lower() %}error{% endif %}">{{ msg }}</div>
        {% endif %}
        
        <h2>View Attendance</h2>
        <p>Your attendance is linked to your signed-in student account.</p>
        <a class="btn-submit" href="{{ url_for('student_view_attendance') }}">View My Attendance</a>

    </div>

    <div id="container" class="wrap"></div>
    
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const branch = document.getElementById("branch");
        const year = document.getElementById("year");
        const subject = document.getElementById("subject");
        const refresh = () => window.updateAttendanceSubjects(branch.value, year.value, subject);
        branch.addEventListener("change", refresh);
        year.addEventListener("change", refresh);
        refresh();
      });
    </script>
</body>

</html>
