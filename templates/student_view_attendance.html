<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Attendance</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .mainHeading {
            text-align: center;
            background-color: #110f92;
            color: white;
            padding: 20px;
        }
        .navbar {
            background-color: #000;
            padding: 10px;
            text-align: center;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin: 0 15px;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .wrap {
            width: 30%;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border: 5px solid rgb(204, 122, 16);
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .wrap h2 {
            color: darkblue;
            font-size: 24px;
        }
        .wrap select,
        .wrap input[type="date"] {
            width: 90%;
            height: 35px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid rgb(25, 9, 119);
            padding: 5px;
            text-align: center;
        }
        .wrap .btn-submit {
            padding: 10px;
            width: 100%;
            background-color: #55add6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        .wrap .btn-submit:hover {
            background-color: #3b92c4;
        }
        .table-container {
            width: 95%;
            margin: 30px auto;
            overflow-x: auto;
            display: {% if result %}block{% else %}none{% endif %};
        }
        .view {
            width: 100%;
            border-collapse: collapse;
        }
        .view th, .view td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        .view th {
            background-color: #110f92;
            color: white;
        }
        .present { background-color: #c8e6c9; font-weight: bold; }
        .absent { background-color: #ffcccb; font-weight: bold; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">Home</a>
        <a href="{{ url_for('logout') }}">Logout</a>
        <a href="/studentDashboard">Dashboard</a>
    </div>
    <div class="mainHeading">
        <h1>View Attendance</h1>
    </div>
    <div class="wrap">
        {% if msg %}
            <div class="message {% if 'error' in msg.lower() %}error{% else %}success{% endif %}">
                {{ msg }}
            </div>
        {% endif %}
        <h2>Select Filters</h2>

        <form action="/student/view_attendance" method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">


            <label><b></b></label>
            <select name="year" id="year" required>
                <option value="">-- Select Year --</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>


            <label for="branch"><b></b></label>
            <select name="branch" id="branch" required>
                <option value="">--Select Branch--</option>
                <option value="ce">CE</option>
                <option value="it">IT</option>
                <option value="me">ME</option>
                <option value="ec">EC</option>
                <option value="ee">EE</option>   
            </select>
                <label for="subject"><b></b></label>
            <select name="subject" id="subject" required>
                <option value="">-- Select Subject --</option>
            </select>
                

          




            <label><b>From Date:</b></label>
            <input type="date" name="from" required>
            <label><b>To Date:</b></label>
            <input type="date" name="to" required>
            <button type="submit" class="btn-submit">View Attendance</button>
        </form>
    </div>
    
    <!-- ✅ Table is now conditionally displayed using Jinja2 -->
    <div class="table-container" id="attendanceTable" style="display: {% if request.method == 'POST' and result %}block{% else %}none{% endif %};">
        <h2>Attendance Record</h2>
        <table class="view">
            <tr>
                <th>Name</th>
                <th>Student ID</th>
                <th>Batch</th>
                <th>Branch</th>
                <th>Year</th>
                <th>Subject</th>
                {% for date in dates %}
                    <th>{{ date }}</th>
                {% endfor %}
                <th>Attendance %</th>
            </tr>
            {% for row in result %}
            <tr>
                {% for item in row %}
                    <td>{{ item }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </table>
    </div>
    
    




    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let batchSelect = document.getElementById("batchSelect");
            let currentYear = new Date().getFullYear();
            
            // Populate Batch Dropdown
            // for (let year = 2024; year <= currentYear; year++) {
            //     let option = document.createElement("option");
            //     option.value = year;
            //     option.textContent = year;
            //     batchSelect.appendChild(option);
            // }
    
            let subjectDropdown = document.getElementById("subject");
            let yearDropdown = document.getElementById("year");
            let branchDropdown = document.getElementById("branch");
    
            // Subject List
            const subjects = {
                "ce": { 
                    "1": ["M1", "M2", "Physics", "Chemistry"], 
                    "2": ["M3", "DSA", "COA", "DBMS"], 
                    "3": ["OS", "CN", "TOC", "SE"], 
                    "4": ["AI", "ML", "Cloud Computing", "Big Data"] 
                },
                "it": { 
                    "1": ["Maths", "Physics", "C Programming"], 
                    "2": ["Data Structures", "DBMS", "OOP"], 
                    "3": ["Software Engineering", "Networks", "Cyber Security"], 
                    "4": ["Cloud Computing", "Blockchain", "Big Data"] 
                },
                "me": { 
                    "1": ["Physics", "Chemistry", "Graphics"], 
                    "2": ["Thermodynamics", "Mechanics", "Fluid Mechanics"], 
                    "3": ["Heat Transfer", "Dynamics", "Manufacturing"], 
                    "4": ["Automobile", "Robotics", "Production"] 
                },
                "ec": {
                    "1": ["Basic Electronics", "Maths", "Physics"],
                    "2": ["Analog Circuits", "Digital Electronics", "Signals & Systems"],
                    "3": ["Microprocessors", "VLSI", "Embedded Systems"],
                    "4": ["Wireless Communication", "Antenna Design", "IoT"]
                },
                "ee": {
                    "1": ["Electrical Circuits", "Maths", "Physics"],
                    "2": ["Machines", "Power Systems", "Electromagnetics"],
                    "3": ["Control Systems", "Power Electronics", "Energy Management"],
                    "4": ["Smart Grid", "Renewable Energy", "High Voltage Engineering"]
                }
            };
    
            // Function to Update Subject Dropdown
            function updateSubjects() {
                let branch = branchDropdown.value;
                let year = yearDropdown.value;
                subjectDropdown.innerHTML = "<option value=''>-- Select Subject --</option>";
    
                if (subjects[branch] && subjects[branch][year]) {
                    subjects[branch][year].forEach(sub => {
                        let option = document.createElement("option");
                        option.value = sub;
                        option.textContent = sub;
                        subjectDropdown.appendChild(option);
                    });
                }
            }
    
            // Event Listeners for Branch and Year Selection
            branchDropdown.addEventListener("change", updateSubjects);
            yearDropdown.addEventListener("change", updateSubjects);
        });
    </script>


</body>
</html>
