<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; }
        main { max-width: 420px; margin: 8vh auto; padding: 28px; background: white; border-radius: 12px; }
        h1 { color: #110f92; text-align: center; }
        label { display: block; margin: 14px 0 6px; }
        input { width: 100%; box-sizing: border-box; padding: 12px; }
        button { width: 100%; margin-top: 20px; padding: 12px; background: #110f92; color: white; border: 0; cursor: pointer; }
        .message { color: #b00020; }
    </style>
</head>
<body>
<main>
    <h1>Set a New Password</h1>
    <p>Your legacy login credential has been secured. Choose a new password to continue.</p>
    {% if msg %}<p class="message">{{ msg }}</p>{% endif %}
    <form method="POST" action="{{ url_for('change_password') }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <label for="new_password">New password</label>
        <input id="new_password" type="password" name="new_password" minlength="12" autocomplete="new-password" required>
        <label for="confirm_password">Confirm new password</label>
        <input id="confirm_password" type="password" name="confirm_password" minlength="12" autocomplete="new-password" required>
        <button type="submit">Update Password</button>
    </form>
    <form action="{{ url_for('logout') }}" method="POST" style="display:inline"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><button type="submit">Logout</button></form>
</main>
</body>
</html>
