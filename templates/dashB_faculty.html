<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Faculty Dashboard | Upload Attendance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
            background-color: #f5f5f5;
        }

        .mainHeading {
            text-align: center;
            background-color: #110f92;
            color: white;
            padding: 20px;
        }

        .navbar {
            background-color: #000;
            padding: 10px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin: 0 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .wrap {
            width: 450px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border: 5px solid rgb(204, 122, 16);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .wrap h2 {
            color: darkblue;
        }

        .wrap input[type="text"],
        .wrap input[type="date"],
        .wrap select,
        .wrap input[type="file"] {
            width: 90%;
            height: 35px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid rgb(25, 9, 119);
            padding: 5px;
            text-align: center;
        }

        .wrap .btn-submit {
            padding: 10px;
            width: 100%;
            background-color: #55add6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .wrap .btn-submit:hover {
            background-color: #3b92c4;
        }

        .message {
            font-size: 18px;
            color: green;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <div class="navbar">
        <a href="/faculty/view_attendance">View Attendance</a>
        <a href="/faculty/edit_attendance">Edit Attendance</a>
        <a href="{{ url_for('logout') }}">Logout</a>  <!-- ✅ Logout Button Added -->

        
        
        <!-- <a href="/">Logout</a> -->
    </div>

    <!-- Page Heading -->
    <div class="mainHeading">
        <h1>Faculty Dashboard</h1>
    </div>

    <!-- Form Wrapper -->
    <div class="wrap">
        {% if msg %}
            <div class="message {% if 'error' in msg.lower() %}error{% endif %}">{{ msg }}</div>
        {% endif %}

        <h2>Upload Attendance</h2>
        
        <form action="/faculty" method="POST" enctype="multipart/form-data">
            <input type="text" name="faculty_id" placeholder="Faculty ID" required>
            <input type="text" name="batch" placeholder="Batch (Ex. 2024)" pattern="\d{4}" title="Enter a valid batch year (e.g., 2024)" required>
            
            <label for="branch"><b></b></label>
            <select name="branch" id="branch" required>
                <option value="">-- Select Branch --</option>
                <option value="ce">CE</option>
                <option value="it">IT</option>
                <option value="me">ME</option>
                <option value="ec">EC</option>
                <option value="ee">EE</option>   
            </select>
            
            <label for="year"><b></b></label>
            <select name="year" id="year" required>
                <option value="">-- Select Year --</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>
            
            <label for="subject"><b></b></label>
            <select name="subject" id="subject" required>
                <option value="">-- Select Subject --</option>
            </select>
            
            <label for="date"><b></b></label>
            <input type="date" name="date" required>
            
            <h4>Note: Upload an MP4 video file</h4>
            <input type="file" name="file" accept=".mp4" required>

            <button type="submit" class="btn-submit">Upload</button>
        </form>
    </div>

    <script>
        document.getElementById("year").addEventListener("change", function() {
    const branch = document.getElementById("branch").value.toUpperCase(); // ✅ Convert to uppercase
    const year = this.value;
    const subjectDropdown = document.getElementById("subject");

    const subjects = {
        'CE': {'1': ["M1", "M2", "Physics", "Chemistry"], '2': ["M3", "DSA", "COA", "DBMS"], '3': ["OS", "CN", "TOC", "SE"], '4': ["AI", "ML", "Cloud Computing", "Big Data"]},
        'IT': {'1': ["M1", "M2", "Physics", "Chemistry"], '2': ["DSA", "OOPS", "DBMS", "Computer Networks"], '3': ["OS", "Web Technologies", "AI", "Cybersecurity"], '4': ["Blockchain", "IoT", "Data Science", "DevOps"]},
        'ME': {'1': ["Engineering Mechanics", "M1", "Physics", "Chemistry"], '2': ["Thermodynamics", "Fluid Mechanics", "SOM", "Material Science"], '3': ["Manufacturing", "IC Engines", "Robotics", "Heat Transfer"], '4': ["Automobile Engineering", "Mechatronics", "Advanced Robotics", "Computational Fluid Dynamics"]},
        'EC': {'1': ["M1", "M2", "Physics", "Chemistry"], '2': ["Digital Electronics", "Microprocessors", "Signals & Systems", "Communication Networks"], '3': ["Embedded Systems", "VLSI", "Wireless Communication", "DSP"], '4': ["IoT", "Optical Fiber Communication", "Radar Systems", "Satellite Communication"]}
    };

    subjectDropdown.innerHTML = "<option value=''>-- Select Subject --</option>";
    
    if (subjects[branch] && subjects[branch][year]) { // ✅ Ensure branch & year exist
        subjects[branch][year].forEach(sub => {
            const option = document.createElement("option");
            option.value = sub;
            option.textContent = sub;
            subjectDropdown.appendChild(option);
        
                });
            }
        });
    </script>
    
</body>
</html>
